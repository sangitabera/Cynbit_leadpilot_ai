
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cynbit-leadpilot-backend

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DATABASE_URL: sqlite:////app/data/leads.db
      PYTHONPATH: /app

    volumes:
      - leadpilot_data:/app/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cynbit-leadpilot-frontend

    command: >
      streamlit run frontend/streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true

    ports:
      - "8501:8501"

    environment:
      API_BASE_URL: http://backend:8000
      PYTHONPATH: /app

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  leadpilot_data:
